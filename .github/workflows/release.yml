name: Build and Release

on:
  release:
    types: [created]
  push:
    tags:
      - 'v*'
  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      upload_to_pypi:
        description: 'Upload to PyPI (only for testing)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write  # For PyPI trusted publishing

jobs:
  test:
    name: Run tests before release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        
    - name: Run tests
      run: pytest tests/ -v
      
    - name: Lint code
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  build:
    name: Build distribution packages
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        
    - name: Build packages
      run: python -m build
      
    - name: Verify packages
      run: |
        twine check dist/*
        python -m pip install dist/*.whl
        python -c "import pyepisuite; print(f'Successfully installed PyEPISuite {pyepisuite.__version__}')"
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-packages
        path: dist/
        retention-days: 30

  publish-to-pypi:
    name: Publish to PyPI
    needs: [test, build]
    runs-on: ubuntu-latest
    # Only publish on release creation or manual trigger
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.upload_to_pypi == 'true')
      
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v6
      with:
        name: dist-packages
        path: dist/
        
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
        verify-metadata: true
        verbose: true
        print-hash: true

  publish-to-github:
    name: Upload to GitHub Release
    needs: [test, build]
    runs-on: ubuntu-latest
    # Only run for releases or tags
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v6
      with:
        name: dist-packages
        path: dist/
        
    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*.whl
          dist/*.tar.gz
        tag_name: ${{ github.ref_name }}
        generate_release_notes: true
        draft: false
        prerelease: false
