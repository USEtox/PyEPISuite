site_name: PyEPISuite Documentation
site_description: A Python client for the EPISuite API with DataFrame utilities
site_author: Ali A. Eftekhari
site_url: https://usetox.github.io/PyEPISuite/

repo_name: USEtox/PyEPISuite
repo_url: https://github.com/USEtox/PyEPISuite

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_toc_entry: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - footnotes
  - md_in_html
  - attr_list

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
  - User Guide:
    - API Client: user-guide/api-client.md
    - DataFrame Utilities: user-guide/dataframe-utils.md
    - Experimental Data: user-guide/experimental-data.md
  - Examples:
    - Basic Usage: examples/basic-usage.md
    - Data Analysis: examples/data-analysis.md
    - Batch Processing: examples/batch-processing.md
  - API Reference:
    - API Client: api-reference/api-client.md
    - Models: api-reference/models.md
    - DataFrame Utils: api-reference/dataframe-utils.md
    - Utilities: api-reference/utils.md
    - Experimental Data: api-reference/experimental-data.md
  - Development: development.md
  - Contributing: contributing.md
  - Changelog: changelog.md
